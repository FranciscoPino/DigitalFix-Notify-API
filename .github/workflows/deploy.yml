name: Deploy DigitalFix Notify to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: digitalfix-ec2-notify
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/franciscopino/ms-digitalfix-notify:${{ github.sha }}
  CONTAINER_NAME: ms-digitalfix-notify

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate deployment configuration
        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          for name in TARGET_HOST_IP RABBITMQ_HOST RABBITMQ_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing GitHub variable/secret: $name"; exit 1; fi
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/franciscopino/ms-digitalfix-notify:latest
      - name: Deploy to shared EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GH_CR_PAT }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,CONTAINER_NAME,RABBITMQ_HOST,RABBITMQ_PORT,RABBITMQ_USERNAME,RABBITMQ_PASSWORD,RABBITMQ_VHOST
          script: |
            if ! command -v docker >/dev/null 2>&1; then sudo dnf install -y docker; sudo systemctl enable --now docker; fi
            sudo systemctl start docker
            sudo docker network create digitalfix-backend-net >/dev/null 2>&1 || true
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull "$IMAGE"
            sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            sudo docker run -d --name "$CONTAINER_NAME" --network digitalfix-backend-net --restart unless-stopped \
              -e SERVER_PORT=8086 -e RABBITMQ_HOST="$RABBITMQ_HOST" -e RABBITMQ_PORT="${RABBITMQ_PORT:-5672}" \
              -e RABBITMQ_USERNAME="${RABBITMQ_USERNAME:-guest}" -e RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
              -e RABBITMQ_VHOST="${RABBITMQ_VHOST:-/}" "$IMAGE"
            sudo docker image prune -f
